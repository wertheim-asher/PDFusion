name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: build tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'pdf-tool-${{ matrix.platform }}'

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: flatten installers
        run: |
          mkdir -p flat
          find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} flat/ \;
          ls -la flat

      - name: publish rolling "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: 'Latest desktop build'
          body: |
            Automatically rebuilt from the most recent push to `main`. This is a rolling release — assets here always match the current state of the app.

            - **Windows**: run the `.exe` installer, or the raw portable exe from workflow artifacts.
            - **macOS**: open the `.dmg`, drag to Applications. Not code-signed — right-click → Open the first time to bypass Gatekeeper.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: 'flat/*'
